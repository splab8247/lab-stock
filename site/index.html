<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>실험실 재고 현황</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e3e6eb;--acc:#2563eb;--empty:#f1f3f6;--hit:#f59e0b;--ok:#16a34a;--bad:#dc2626;
--k-mouse:#64748b;--sx-m:#D9E1F2;--sx-mt:#1e3a8a;--sx-f:#F5DDE4;--sx-ft:#9d174d;--kh:#fde68a;--kh-t:#92400e;--occ-lo:#22c55e;--occ-mid:#f59e0b;--occ-hi:#ef4444;
--c-cell:#dbeafe;--c-bact:#dcfce7;--c-reag:#fef3c7;--c-si:#fce7f3;--k-cell:#2563eb;--k-bact:#16a34a;--k-reag:#d97706;--k-si:#db2777}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111418;--panel:#1a1e24;--ink:#e6e9ee;--mute:#9aa3af;--line:#2c323b;--empty:#20252c;--sx-m:#1e3a5f;--sx-mt:#bfdbfe;--sx-f:#5a2340;--sx-ft:#fbcfe8;--kh:#5a4614;--kh-t:#fde68a;
--c-cell:#1e3a5f;--c-bact:#1f4a32;--c-reag:#5a4614;--c-si:#5a2340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
header{padding:28px 28px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 4px}header .sub{color:var(--mute);font-size:14px}
.hright{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{padding:14px 18px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:340px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:var(--bad);border-color:var(--bad)}.btn.del:hover{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.mode{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--mute)}.mode.on{background:#dcfce7;color:#166534}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 100px)}
nav{border-right:1px solid var(--line);padding:12px;background:var(--panel);overflow:auto}
nav details{margin-bottom:6px}
nav summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-weight:600}
nav summary::-webkit-details-marker{display:none}
nav summary::before{content:"▸";font-size:11px;color:var(--mute);transition:transform .15s}
nav details[open]>summary::before{transform:rotate(90deg)}
nav summary:hover,nav button:hover{background:var(--bg)}
nav .cnt{margin-left:auto;font-size:11px;font-weight:400;color:var(--mute)}
nav button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 10px 6px 28px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
nav .on,nav .on .cnt{background:var(--acc);color:#fff}
nav .all{padding-left:10px;font-weight:600;margin-bottom:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
main{padding:20px;overflow:auto;min-width:0}
.crumb{color:var(--mute);font-size:13px;margin-bottom:10px}
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:96px}
.stat b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat.occ{position:relative;overflow:hidden;min-width:120px}
.stat.occ>b,.stat.occ>span{position:relative;z-index:1}
.stat.occ .lv{position:absolute;left:0;right:0;bottom:0;height:0;opacity:.35;transition:height 1.1s cubic-bezier(.2,.8,.2,1),background .4s}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px}
.box h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box h2 small{color:var(--mute);font-weight:400;font-size:12px}
.mini{margin-left:auto;display:flex;gap:6px}.mini span{font-size:11px;font-weight:400;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.grid{display:grid;gap:3px}
.hd{font-size:11px;color:var(--mute);text-align:center;align-self:center}
.slot{min-height:60px;border-radius:5px;padding:5px 6px;font-size:11px;line-height:1.25;background:var(--empty);overflow:hidden;word-break:break-word;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.slot:hover{outline:2px solid var(--acc)}
.slot.e:hover::after{content:"+ 새로 입력";color:var(--mute);margin:auto;font-size:10px}
.slot .p{font-weight:600}.slot .s{color:var(--mute);font-size:10px;margin-top:auto}
.slot.m{background:repeating-linear-gradient(45deg,var(--empty),var(--empty) 4px,transparent 4px,transparent 8px);color:var(--mute);font-size:10px;justify-content:center;align-items:center;cursor:default}
.slot.m:hover{outline:none}
.slot.hit{outline:2px solid var(--hit)}.slot.dim{opacity:.25}
.slot .c{font-size:10px}.slot .s{display:flex;flex-direction:column;line-height:1.2}.slot .mg2{font-weight:600;color:var(--ink);opacity:.75}
.slot.mg{justify-content:center;align-items:center;text-align:center;font-size:12px}.slot.mg .s{margin-top:0}
.grid.ed{user-select:none}
.ana{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.ch select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px;max-width:220px}
.mute{color:var(--mute);font-size:12px}.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.bars{max-height:300px;overflow:auto;padding-right:4px}
.bar{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer;font-size:12px}
.bar:hover,.bar.on{background:var(--bg)}.bar.cur .bl{font-weight:700}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt{height:12px;background:var(--empty);border-radius:3px;overflow:hidden}.bt i{display:block;height:100%;border-radius:3px}
.bn{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px 12px}
nav .navsep{font-size:11px;color:var(--mute);margin:12px 10px 4px;text-transform:uppercase;letter-spacing:.05em}
nav .mnav{padding-left:10px;font-weight:600}
.mbar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mbar2 select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--panel);color:var(--mute);padding:5px 12px;font-size:12px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff}
.chk{font-size:12px;color:var(--mute);display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.mpick{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.mtable{padding:0;overflow:auto}
.mt{font-size:13px}.mt th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.mt td{white-space:nowrap}.mt td.na{color:var(--line)}
.mt tr[data-mid]{cursor:pointer}.mt tr[data-mid]:hover td{background:var(--bg)}
.mt tr.cg td{background:var(--bg);font-weight:700;font-size:12px;padding-top:10px}
/* mouse: sex cell colors match the Excel conditional format (M #D9E1F2, F #F5DDE4); only Kras +/- is highlighted */
.mt td.sx{font-weight:700}.mt td.sx.m{background:var(--sx-m);color:var(--sx-mt)}.mt td.sx.f{background:var(--sx-f);color:var(--sx-ft)}
.sxb{font-weight:700;padding:2px 10px;border-radius:6px}.sxb.m{background:var(--sx-m);color:var(--sx-mt)}.sxb.f{background:var(--sx-f);color:var(--sx-ft)}
.kh{font-family:ui-monospace,Consolas,monospace;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--kh);color:var(--kh-t)}
.pick{display:inline-flex;gap:4px;flex-wrap:wrap}.pick button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.pick button:hover{border-color:var(--acc)}.pick button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pick button.sm.on{background:var(--sx-m);border-color:var(--sx-mt);color:var(--sx-mt);font-weight:700}.pick button.sf.on{background:var(--sx-f);border-color:var(--sx-ft);color:var(--sx-ft);font-weight:700}
.pick button.kp.on{background:var(--kh);border-color:var(--kh-t);color:var(--kh-t);font-weight:700}
#det input[type=date]{max-width:200px}
#det select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#det input[readonly]{background:var(--empty);color:var(--mute)}
#det .hint{font-size:11px;color:var(--mute);margin-top:3px}
#det .cnt2{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--mute)}#det .cnt2 input{width:64px;padding:4px 6px}
dialog.toed{width:520px}.toed img{display:block;width:100%;max-width:440px;margin:12px auto 0;background:#fff;border-radius:8px}
.hist{max-height:300px;overflow:auto}.hist.open{max-height:none}
.hi{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;border-radius:4px}
.hi:hover{background:var(--bg)}.hw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hm{color:var(--mute);font-size:11px;white-space:nowrap}
.hv{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--mute);white-space:nowrap}
.hv.v-추가{background:#dcfce7;color:#166534}.hv.v-수정{background:#dbeafe;color:#1e40af}.hv.v-삭제{background:#fee2e2;color:#991b1b}.hv.v-병합,.hv.v-병합해제{background:#ede9fe;color:#5b21b6}.hv.v-이름변경{background:#fef3c7;color:#92400e}
.slot.flash{animation:flash 1.6s ease}@keyframes flash{0%,60%{outline:3px solid var(--hit);outline-offset:-3px}100%{outline-color:transparent}}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer}.chip:hover{border-color:var(--acc);color:var(--acc)}
.more{margin-top:6px;border:0;background:none;color:var(--acc);cursor:pointer;font-size:12px}
.ana.one{grid-template-columns:1fr}
@media(max-width:1000px){.ana{grid-template-columns:1fr}}
.slot.sel{outline:2px dashed var(--acc);outline-offset:-2px;filter:brightness(.92)}
#mbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0003;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;transition:transform .2s;z-index:6;font-size:14px}
#mbar.show{transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-150%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;transition:transform .2s;z-index:7;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--bad);color:#fff}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
tr[data-id]{cursor:pointer}tr[data-id]:hover td{background:var(--bg)}tr.dim{opacity:.3}
#det{position:fixed;top:0;right:0;height:100%;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px #0002;padding:20px;transform:translateX(100%);transition:transform .2s;overflow:auto;z-index:5}
#det.open{transform:none}
#det h3{margin:4px 0 2px;font-size:18px}#det .pos{font-size:12px;color:var(--mute)}
#det dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:16px 0 0;font-size:13px;align-items:center}
#det dt{color:var(--mute)}#det dd{margin:0;word-break:break-word}#det dd#det input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#det .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#det .x{float:right;cursor:pointer;border:0;background:none;color:var(--mute);font-size:20px}
.msg{margin-top:12px;font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--panel);color:var(--ink);width:420px;max-width:92vw}
dialog label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
dialog input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog p{font-size:12px;color:var(--mute);margin:6px 0 0}
dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
nav .addbox{color:var(--acc);font-size:12px;margin-top:2px}
.btn.sm{padding:3px 10px;font-size:11px;font-weight:400}
.box h2 .btn.sm{margin-left:4px}
.empty{color:var(--mute);padding:40px;text-align:center}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);max-height:240px}#q{min-width:0;width:100%}.hright{width:100%}main{padding:16px}.box{overflow-x:auto}.grid{min-width:640px}header{padding:20px 16px}}
</style></head><body>
<header><div><h1>실험실 재고 현황</h1><div class="sub" id="sub">불러오는 중…</div></div>
<div class="hright"><input id="q" placeholder="검색 (예: PD36, siOGT, pSP12)"><a class="btn" id="xlb" href="stock.xlsx" download>⬇ 엑셀</a><button class="btn" id="histb">최근 기록</button><span class="mode" id="mode">보기 전용</span><button class="btn" id="setb">⚙ 편집 설정</button></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"><div class="empty">데이터를 불러오는 중…</div></main></div>
<aside id="det"><button class="x" id="dx" aria-label="닫기">✕</button><div class="pos" id="dpos"></div><h3 id="dttl"></h3><dl id="ddl"></dl><div class="acts" id="dacts"></div><div class="msg" id="dmsg"></div></aside>
<dialog id="toed" class="toed"><h3 style="margin:0">발가락 표시 (Toe clipping)</h3>
 <p>마우스 번호의 <b>일의 자리 = 앞발</b>(1~8), <b>십의 자리 = 뒷발</b>(10~80)을 자릅니다. 0은 자르지 않음, 숫자 9는 쓰지 않습니다. 엄지는 자르지 않습니다.<br>예) KPC-014 → 앞발 4 · 뒷발 10</p>
 <img src="toe.png" alt="발가락 번호 그림: 왼쪽 앞발 1~4, 오른쪽 앞발 5~8, 왼쪽 뒷발 10~40, 오른쪽 뒷발 50~80">
 <div class="row"><button class="btn" onclick="this.closest('dialog').close()">닫기</button></div></dialog>
<div id="mbar"></div><div id="toast"></div>
<dialog id="boxd"><h3 style="margin:0">박스 추가</h3>
 <label>시트</label><select id="b_sheet"></select>
 <label>박스 이름</label><input id="b_name" placeholder="예: cell_stock9">
 <div style="display:flex;gap:10px"><div style="flex:1"><label>열 수 (A~)</label><input id="b_cols" type="number" min="1" max="26" value="9"></div><div style="flex:1"><label>행 수 (1~)</label><input id="b_rows" type="number" min="1" max="50" value="9"></div></div>
 <p>빈 칸으로 만들어집니다. 만든 뒤 칸을 눌러 입력하세요.</p><p id="b_msg" style="color:var(--bad)"></p>
 <div class="row"><button class="btn" id="b_cancel">취소</button><button class="btn pri" id="b_ok">추가</button></div></dialog>
<dialog id="setd"><h3 style="margin:0">편집 설정</h3>
 <p>이 컴퓨터의 이 브라우저에만 저장됩니다. 공용 PC에서는 사용 후 [지우기]를 누르세요.</p>
 <label>내 이름 (수정 기록에 남음)</label><input id="s_name" placeholder="홍길동">
 <label>GitHub 토큰 (관리자에게 받은 값)</label><input id="s_tok" type="password" placeholder="github_pat_…">
 <label>저장소 (owner/repo)</label><input id="s_repo" placeholder="자동 인식">
 <div class="row"><button class="btn" id="s_clr">지우기</button><button class="btn" id="s_cancel">닫기</button><button class="btn pri" id="s_ok">저장</button></div></dialog>
<script>
const SHEETS=[
 {key:'celline', file:'celline.csv', label:'Cell line', c:'--c-cell', k:'--k-cell', p:'cell line', s:'date'},
 {key:'bacteria',file:'bacteria.csv',label:'Bacteria',  c:'--c-bact', k:'--k-bact', p:'name', s:'date'},
 {key:'reagent', file:'reagent.csv', label:'Reagent',   c:'--c-reag', k:'--k-reag', p:'name', s:'concentration'},
 {key:'siRNA',   file:'siRNA.csv',   label:'siRNA',     c:'--c-si',   k:'--k-si',   p:'siRNA name', s:'concentration'}];
const BRANCH='main';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

// ---------- settings (per browser) ----------
const LS={get(k){try{return localStorage.getItem('stock.'+k)||''}catch(e){return''}},set(k,v){try{v?localStorage.setItem('stock.'+k,v):localStorage.removeItem('stock.'+k)}catch(e){}}};
function guessRepo(){const h=location.hostname.match(/^([^.]+)\.github\.io$/);const seg=location.pathname.split('/').filter(Boolean)[0];return h&&seg?`${h[1]}/${seg}`:''}
const cfg={get name(){return LS.get('name')},get tok(){return LS.get('tok')},get repo(){return LS.get('repo')||guessRepo()}};
const canEdit=()=>!!(cfg.tok&&cfg.repo);

// ---------- CSV ----------
function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.length>1||r[0]!=='')}
const toCSV=rows=>rows.map((r,i)=>r.map(v=>i===0&&!/[",\n]/.test(v)?v:'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')+'\n';

// ---------- GitHub API ----------
const b64e=s=>{const b=new TextEncoder().encode(s);let o='';b.forEach(x=>o+=String.fromCharCode(x));return btoa(o)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`+(opt.method?'':`?ref=${BRANCH}&t=${Date.now()}`),
 {...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.tok,...(opt.headers||{})}});
 if(!r.ok){const e=new Error((await r.json().catch(()=>({}))).message||r.statusText);e.status=r.status;throw e}return r.json()}
async function loadSheet(sh){
 if(canEdit()){try{const j=await gh('data/'+sh.file);sh.sha=j.sha;return b64d(j.content)}catch(e){console.warn('API load failed, fallback',e);sh.apiErr=e.message}}
 const r=await fetch('data/'+sh.file+'?t='+Date.now());if(!r.ok)throw new Error(sh.file+' 불러오기 실패');return r.text()}

// ---------- model ----------
const pp=p=>{const m=/^([A-Z]+)-(\d+)$/.exec(p);return m?{c:m[1],r:+m[2]}:null};
function build(sh,text){const rows=parseCSV(text);sh.cols=rows[0];sh.rows=rows.slice(1);
 const ix=n=>sh.cols.indexOf(n),iP=ix(sh.p),iS=ix(sh.s),iMg=ix('manager'),iD=ix('date');sh.iM=ix('merged_to');const map=new Map();
 sh.vis=sh.cols.map((c,i)=>i).filter(i=>i>=2&&i!==sh.iM);  // columns shown in the detail panel
 sh.rows.forEach((r,ri)=>{while(r.length<sh.cols.length)r.push('');const o={sh,ri,vals:r,box:r[0],pos:r[1],prim:'',sec:r[iS]||''};
  // name shown in the slot: the sheet's main column, else the first non-empty field
  o.prim=r[iP]||(sh.vis.map(i=>r[i]).find(v=>v)||'');
  o.mgr=iMg>=0?r[iMg]:'';o.date=iD>=0?r[iD]:'';
  o.mergeTo=sh.iM>=0?r[sh.iM]:'';o.merged=!!o.mergeTo;o.filled=!o.merged&&sh.vis.some(i=>r[i]);o.text=r.join(' ').toLowerCase();
  if(!map.has(o.box))map.set(o.box,{sh,name:o.box,slots:[]});map.get(o.box).slots.push(o)});
 sh.boxes=[...map.values()];
 sh.boxes.forEach(b=>{b.isList=b.slots.every(s=>s.pos.startsWith('list-'));if(b.isList)return;
  b.colsL=[...new Set(b.slots.map(s=>pp(s.pos).c))];b.nrow=Math.max(...b.slots.map(s=>pp(s.pos).r));
  b.at=new Map(b.slots.map(s=>[s.pos,s]));
  // span rect per slot (covered cells extend their anchor's rect); indices: c = column index, r = row number
  b.slots.forEach(s=>{const p=pp(s.pos);s.rect={c0:b.colsL.indexOf(p.c),c1:b.colsL.indexOf(p.c),r0:p.r,r1:p.r}});
  b.slots.filter(s=>s.merged).forEach(s=>{const a=b.at.get(s.mergeTo);if(!a){s.merged=false;return}const p=pp(s.pos),ci=b.colsL.indexOf(p.c);
   a.rect.c0=Math.min(a.rect.c0,ci);a.rect.c1=Math.max(a.rect.c1,ci);a.rect.r0=Math.min(a.rect.r0,p.r);a.rect.r1=Math.max(a.rect.r1,p.r);a.isAnchor=true})})}
const ALL=()=>SHEETS.flatMap(s=>s.boxes||[]);
let view={t:'all'},term='',hl=null;  // hl: exact highlight set by the analytics chips {kind:'item'|'mgr',key,box}
const NOMGR='(미기재)';
const hlTest=s=>hl.kind==='item'?s.prim.trim()===hl.key:(s.mgr.trim()||NOMGR)===hl.key;
const filt=()=>!!(term||hl);
const match=s=>s.filled&&(hl?hlTest(s):!!term&&s.text.includes(term));
function scope(){return view.t==='all'?ALL():view.t==='group'?SHEETS.find(g=>g.key===view.g).boxes:ALL().filter(b=>b.sh.key===view.g&&b.name===view.b)}
function counts(boxes){let f=0,e=0,h=0;boxes.forEach(b=>b.slots.forEach(s=>{if(s.merged)return;s.filled?f++:e++;if(match(s))h++}));return{f,e,h,n:boxes.length}}
const cnt=boxes=>{const c=counts(boxes);return filt()?`${c.h} / ${c.f}`:`${c.f}`};
const rectTxt=(b,r)=>`${b.colsL[r.c0]}-${r.r0} ~ ${b.colsL[r.c1]}-${r.r1}`;

// ---------- render ----------
const nav=$('nav'),main=$('main');
function renderNav(){const open=new Set([...nav.querySelectorAll('details[open]')].map(d=>d.dataset.g));
 let h=`<button class="all${view.t==='all'?' on':''}" data-v='{"t":"all"}'>전체 보기<span class="cnt">${cnt(ALL())}</span></button>`;
 SHEETS.forEach(g=>{h+=`<details data-g="${g.key}"${open.has(g.key)||view.g===g.key?' open':''}><summary><i class="dot" style="background:var(${g.k})"></i>${g.label}<span class="cnt">${cnt(g.boxes)}</span></summary>`;
  g.boxes.forEach(b=>{const on=view.t==='box'&&view.g===g.key&&view.b===b.name;
   h+=`<button class="${on?'on':''}" data-v='${esc(JSON.stringify({t:'box',g:g.key,b:b.name}))}'>${esc(b.name)}<span class="cnt">${cnt([b])}</span></button>`});
  if(canEdit())h+=`<button class="addbox" data-add="${g.key}">＋ 박스 추가</button>`;h+='</details>'});
 if(MOUSE.cols.length)h+=`<div class="navsep">동물</div><button class="mnav${view.t==='mouse'?' on':''}" data-v='{"t":"mouse"}'><i class="dot" style="background:var(--k-mouse)"></i>KPC mouse<span class="cnt">${MOUSE.rows.length}</span></button>`;
 nav.innerHTML=h}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;view=JSON.parse(b.dataset.v);render()});
const sid=s=>`${s.sh.key}|${s.ri}`;
function slotHTML(s){const R=s.rect,big=R.c1>R.c0||R.r1>R.r0;
 const place=`grid-row:${R.r0+1}/${R.r1+2};grid-column:${R.c0+2}/${R.c1+3};`;
 const data=`data-id="${sid(s)}" data-pos="${s.pos}" data-rect="${R.c0},${R.r0},${R.c1},${R.r1}"`;
 if(!s.filled)return`<div class="slot e${big?' mg':''}${filt()?' dim':''}" ${data} style="${place}"></div>`;
 const cls=(big?' mg':'')+(filt()?(match(s)?' hit':' dim'):'');
 return`<div class="slot${cls}" ${data} style="${place}background:var(${s.sh.c})" title="${esc(s.prim)}"><span class="p">${esc(s.prim)}</span>${s.sh.s!=='date'&&s.sec&&s.sec!==s.prim?`<span class="c">${esc(s.sec)}</span>`:''}${s.mgr||s.date?`<span class="s">${s.mgr?`<span class="mg2">${esc(s.mgr)}</span>`:''}${esc(s.date)}</span>`:''}</div>`}
function boxHTML(b){const c=counts([b]);
 let h=`<div class="box"><h2><i class="dot" style="background:var(${b.sh.k})"></i>${esc(b.name)}<small>· ${b.sh.label}</small><span class="mini"><span>filled ${c.f}</span><span>empty ${c.e}</span>${filt()?`<span>match ${c.h}</span>`:''}</span>${canEdit()?`<button class="btn sm" data-renbox="${b.sh.key}|${esc(b.name)}">이름 변경</button><button class="btn sm del" data-delbox="${b.sh.key}|${esc(b.name)}">박스 삭제</button>`:''}</h2>`;
 if(b.isList){const ic=b.sh.cols.indexOf('company (Cat#)');return h+`<table>${b.slots.map(s=>`<tr class="${filt()&&!match(s)?'dim':''}" data-id="${sid(s)}"><td style="width:60px;color:var(--mute)">${s.pos}</td><td><b>${esc(s.prim)}</b></td><td style="color:var(--mute)">${esc(s.vals[ic]||'')}</td></tr>`).join('')}</table></div>`}
 h+=`<div class="grid${canEdit()?' ed':''}" data-bk="${b.sh.key}|${esc(b.name)}" style="grid-template-columns:22px repeat(${b.colsL.length},minmax(0,1fr));grid-template-rows:auto repeat(${b.nrow},minmax(60px,auto))">`;
 h+=b.colsL.map((x,i)=>`<div class="hd" style="grid-row:1;grid-column:${i+2}">${x}</div>`).join('');
 for(let r=1;r<=b.nrow;r++)h+=`<div class="hd" style="grid-row:${r+1};grid-column:1">${r}</div>`;
 b.slots.forEach(s=>{if(!s.merged)h+=slotHTML(s)});
 return h+'</div></div>'}
// occupancy card: a liquid level that rises to the % (green -> amber -> red as the freezer fills)
let lastOcc=0;
const occHTML=p=>`<div class="stat occ" data-p="${p}" title="채워진 칸 비율"><i class="lv" style="height:${lastOcc}%;background:${occColor(p)}"></i><b>${p}%</b><span>Occupancy</span></div>`;
const occColor=p=>p<60?'var(--occ-lo)':p<85?'var(--occ-mid)':'var(--occ-hi)';
function fillOcc(){const el=main.querySelector('.stat.occ');if(!el)return;const p=+el.dataset.p;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{el.querySelector('.lv').style.height=p+'%';lastOcc=p}))}
function render(){
 // Excel button follows the page: freezer stock -> stock.xlsx, mouse -> mouse.xlsx
 $('xlb').href=view.t==='mouse'?'mouse.xlsx':'stock.xlsx';$('xlb').textContent=view.t==='mouse'?'⬇ 마우스 엑셀':'⬇ 재고 엑셀';
 if(view.t==='mouse')return renderMouse();const boxes=scope(),c=counts(boxes);
 const title=view.t==='all'?'전체':view.t==='group'?SHEETS.find(g=>g.key===view.g).label:`${SHEETS.find(g=>g.key===view.g).label} › ${view.b}`;
 let h=`<div class="crumb">${esc(title)}${canEdit()?' · <span style="color:var(--acc)">여러 칸을 드래그하면 병합할 수 있어요</span>':''}</div><div class="stats"><div class="stat"><b>${c.n}</b><span>Boxes</span></div><div class="stat"><b>${c.f}</b><span>Filled slots</span></div><div class="stat"><b>${c.e}</b><span>Empty slots</span></div>${occHTML(c.f+c.e?Math.round(c.f/(c.f+c.e)*100):0)}${term?`<div class="stat hl"><b>${c.h}</b><span>"${esc(term)}" 검색 결과</span></div>`:''}${hl?`<div class="stat hl"><b>${c.h}</b><span>${hl.kind==='mgr'?'관리자':'항목'} "${esc(hl.key)}" 강조 <button class="btn sm" id="hlx">해제</button></span></div>`:''}</div>`;
 const shown=filt()?boxes.filter(b=>b.slots.some(match)):boxes;
 main.innerHTML=h+'<div class="ana" id="ana"></div>'+(shown.length?shown.map(boxHTML).join(''):'<div class="empty">검색 결과가 없습니다.</div>');renderNav();renderAna();fillOcc()}
const boxOf=bk=>{const [k,n]=bk.split('|');return SHEETS.find(x=>x.key===k).boxes.find(b=>b.name===n)};

let toastT;function toast(t,ok=true){const el=$('toast');el.textContent=t;el.className='show '+(ok?'ok':'bad');clearTimeout(toastT);toastT=setTimeout(()=>el.className='',ok?3500:7000)}

const closeDet=()=>{det.classList.remove('open');cur=null};
$('dx').onclick=closeDet;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('setd').open){closeDet();hideBar()}});

main.addEventListener('click',e=>{if(justDragged)return;const el=e.target.closest('[data-id]');if(!el)return;const [k,ri]=el.dataset.id.split('|');const sh=SHEETS.find(x=>x.key===k);
 const s=sh.boxes.flatMap(b=>b.slots).find(x=>x.ri==ri);openDet(s,!s.filled)});
const DEL_BTN='<button class="btn del" id="d_clear" style="margin-left:auto">삭제</button>';
const viewActs=s=>(s.filled?`<button class="btn pri" id="d_edit">수정</button>`:`<button class="btn pri" id="d_edit">입력</button>`)+(s.isAnchor?'<button class="btn" id="d_unmerge">병합 해제</button>':'')+(s.filled?DEL_BTN:'');
function openDet(s,edit){cur=s;const sh=s.sh;$('dmsg').textContent='';$('dmsg').className='msg';
 const b=sh.boxes.find(x=>x.name===s.box);
 $('dpos').textContent=`${sh.label} · ${s.box} · ${s.isAnchor?'병합 '+rectTxt(b,s.rect):s.pos}`;$('dttl').textContent=s.filled?s.prim:(s.isAnchor?'빈 병합 칸':'빈 칸');
 const editable=edit&&canEdit();
 $('ddl').innerHTML=sh.vis.map(i=>{const c=sh.cols[i],v=s.vals[i];
  return editable?`<dt>${esc(c)}</dt><dd><input data-i="${i}" value="${esc(v)}"${c===sh.p?' autofocus':''}></dd>`:`<dt>${esc(c)}</dt><dd class="${v?'':'na'}">${v?esc(v):'—'}</dd>`}).join('');
 if(editable)$('dacts').innerHTML=`<button class="btn pri" id="d_save">저장</button><button class="btn" id="d_cancel">취소</button>${s.isAnchor?'<button class="btn" id="d_unmerge">병합 해제</button>':''}${s.filled?DEL_BTN:''}`;
 else if(canEdit())$('dacts').innerHTML=viewActs(s);
 else $('dacts').innerHTML=`<span style="font-size:12px;color:var(--mute)">수정하려면 ⚙ 편집 설정에서 토큰을 입력하세요.</span>`;
 det.classList.add('open');const f=det.querySelector('input[autofocus]');if(f)f.focus()}
const keyOf=(box,pos)=>box+'|'+pos;
$('dacts').addEventListener('click',async e=>{if(!cur)return;const id=e.target.id,s=cur,sh=s.sh;
 if(id==='d_edit')openDet(s,true);else if(id==='d_cancel')openDet(s,false);
 else if(id==='d_unmerge'){const b=sh.boxes.find(x=>x.name===s.box);if(!confirm(`${s.box} ${rectTxt(b,s.rect)} 병합을 해제할까요?\n(데이터는 ${s.pos} 칸에 남습니다)`))return;
  const ch=new Map();b.slots.filter(x=>x.mergeTo===s.pos).forEach(x=>{const nv=x.vals.slice();nv[sh.iM]='';ch.set(keyOf(x.box,x.pos),nv)});
  await saveRows(sh,ch,`${s.box} ${rectTxt(b,s.rect)} 병합 해제`,keyOf(s.box,s.pos))}
 else if(id==='d_save'||id==='d_clear'){const nv=s.vals.slice();
  if(id==='d_clear'){if(!confirm(`${s.box} ${s.pos} 칸의 데이터를 삭제할까요?\n(${s.prim})\n\n삭제 후에도 수정 기록에서 되돌릴 수 있습니다.`))return;sh.vis.forEach(i=>nv[i]='')}
  else det.querySelectorAll('input[data-i]').forEach(inp=>nv[+inp.dataset.i]=inp.value.trim());
  await saveRows(sh,new Map([[keyOf(s.box,s.pos),nv]]),`${s.box} ${s.pos} ${id==='d_clear'?'삭제':s.filled?'수정':'추가'}`,keyOf(s.box,s.pos))}});

// ---------- save ----------
// replace rows (by box|matrix) in the latest copy of the CSV
function saveRows(sh,changes,what,focusKey){
 return saveFile(sh,(rows,hdr)=>{
  for(const [k,nv] of changes){const idx=rows.findIndex((r,i)=>i>0&&r[0]+'|'+r[1]===k);if(idx<0)throw new Error(k+' 칸을 찾을 수 없습니다');
   // map by column name in case the file's columns differ from the loaded copy
   rows[idx]=hdr.map(c=>{const i=sh.cols.indexOf(c);return i>=0?nv[i]:(rows[idx][hdr.indexOf(c)]||'')})}
  return rows},what,focusKey)}
// re-read the latest CSV, apply mutate(rows,hdr) -> rows, commit; retries on concurrent saves
async function saveFile(sh,mutate,what,focusKey){
 if(!cfg.name){toast('⚙ 편집 설정에서 이름을 먼저 입력하세요.',false);$('dmsg').className='msg bad';$('dmsg').textContent='⚙ 편집 설정에서 이름을 먼저 입력하세요.';return false}
 $('dmsg').className='msg';$('dmsg').textContent='저장 중…';toast('저장 중…');document.querySelectorAll('#det button,#mbar button,#boxd button').forEach(b=>b.disabled=true);
 try{for(let attempt=0;attempt<3;attempt++){
   // always re-read latest file so concurrent edits on other cells are kept
   const j=await gh('data/'+sh.file);let rows=parseCSV(b64d(j.content));const hdr=rows[0];
   rows=mutate(rows,hdr);
   try{await gh('data/'+sh.file,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({branch:BRANCH,sha:j.sha,
     message:`${what} (${cfg.name})`,content:b64e(toCSV(rows))})});
    hist.unshift({sha:'',date:new Date().toISOString(),what,who:cfg.name,kind:sh===MOUSE?'mouse':'stock'});  // show own edit right away
    (sh.build||build)(sh,toCSV(rows));render();toast('저장했습니다. 엑셀 파일은 1~2분 뒤 자동 갱신됩니다.');
    const ns=focusKey&&sh.boxes.flatMap(b=>b.slots).find(x=>keyOf(x.box,x.pos)===focusKey);
    if(ns&&det.classList.contains('open')){openDet(ns,false);$('dmsg').className='msg ok';$('dmsg').textContent='저장했습니다.'}
    return true}catch(e){if(e.status!==409)throw e}}  // 409 = someone else saved first -> retry on fresh copy
  throw new Error('다른 사람이 동시에 저장 중입니다. 잠시 후 다시 시도하세요.')}
 catch(e){const t='저장 실패: '+(e.status===401?'토큰이 잘못되었거나 만료되었습니다.':e.status===404?'저장소를 찾을 수 없습니다(토큰 권한 확인).':e.message);
  toast(t,false);$('dmsg').className='msg bad';$('dmsg').textContent=t;return false}
 finally{document.querySelectorAll('#det button,#mbar button,#boxd button').forEach(b=>b.disabled=false)}}

 $('b_name').value='';$('b_cols').value=9;$('b_rows').value=9;$('b_msg').textContent='';boxd.showModal();$('b_name').focus()});

 closeDet();const ok=await saveFile(b.sh,rows=>rows.filter((r,i)=>i===0||r[0]!==b.name),`박스 삭제 ${b.name}`);
 if(ok&&view.t==='box'&&view.b===b.name){view={t:'all'};render()}},true);
// rename box: rewrite the box column of every row of that box

let drag=null,pending=null;
const rectOf=el=>{const [c0,r0,c1,r1]=el.dataset.rect.split(',').map(Number);return{c0,r0,c1,r1}};
const inter=(a,b)=>a.c0<=b.c1&&b.c0<=a.c1&&a.r0<=b.r1&&b.r0<=a.r1;
const inside=(a,b)=>a.c0>=b.c0&&a.c1<=b.c1&&a.r0>=b.r0&&a.r1<=b.r1;  // a inside b
const union=(a,b)=>({c0:Math.min(a.c0,b.c0),c1:Math.max(a.c1,b.c1),r0:Math.min(a.r0,b.r0),r1:Math.max(a.r1,b.r1)});

 if(data.length>1)return toast(`데이터가 있는 칸이 ${data.length}개입니다 (${data.map(s=>s.pos).join(', ')}). 하나만 남기고 삭제한 뒤 병합하세요.`,false);

 const ch=new Map();
 affected.forEach(s=>{const nv=s.vals.slice();const p=pp(s.pos),ci=b.colsL.indexOf(p.c),inR=ci>=R.c0&&ci<=R.c1&&p.r>=R.r0&&p.r<=R.r1;

// next free number: sequential, skipping any number that contains the digit 9
const MSTATUS=['Live','Breeding','Planning','Used','Dead','Sacrificed'];
const idNum=id=>{const m=/^KPC-(\d+)$/.exec(id);return m?+m[1]:null};
function nextIds(start,n){const used=new Set(MOUSE.rows.map(r=>mget(r,'id')));let k=idNum(start);if(k===null)return n===1?[start]:null;
 const out=[];while(out.length<n){const id='KPC-'+String(k).padStart(3,'0');if(!/9/.test(String(k))&&!used.has(id))out.push(id);k++}return out}
function nextMouseId(){const ns=MOUSE.rows.map(r=>idNum(mget(r,'id'))||0);return nextIds('KPC-'+String(Math.max(0,...ns)+1).padStart(3,'0'),1)[0]}
// generation like the original Excel: MAX(mother's gen, father's gen)+1 (unknown parent = 0); founders keep the typed value
function genOf(id,seen=new Set()){const r=MOUSE.rows.find(x=>mget(x,'id')===id);if(!r||seen.has(id))return 0;seen.add(id);
 const m=mget(r,'mother'),f=mget(r,'father');if(!m&&!f)return +mget(r,'generation')||0;return Math.max(genOf(m,new Set(seen)),genOf(f,new Set(seen)))+1}
const genFrom=(m,f)=>m||f?Math.max(m?genOf(m):0,f?genOf(f):0)+1:null;
const genDisp=r=>{const g=genFrom(mget(r,'mother'),mget(r,'father'));return g===null?mget(r,'generation'):String(g)};
// parent choices: Breeding mice of the right sex (+ the current value so old records stay editable)
function parentOpts(sex,cur,self){const list=MOUSE.rows.filter(r=>mget(r,'status')==='Breeding'&&mget(r,'sex').toUpperCase()===sex&&mget(r,'id')!==self).map(r=>mget(r,'id'));
 let o=`<option value="">— 선택 안 함 —</option>`+list.map(id=>`<option${id===cur?' selected':''}>${esc(id)}</option>`).join('');
 if(cur&&!list.includes(cur))o+=`<option value="${esc(cur)}" selected>${esc(cur)} (현재값 · Breeding 아님)</option>`;
 if(!list.length)o+=`<option value="" disabled>Breeding ${sex==='F'?'암컷':'수컷'}이 없습니다</option>`;return o}
let curM=null,copyM=null;
function openMouse(id,edit,copyFrom){const src=copyFrom?MOUSE.rows.find(x=>mget(x,'id')===copyFrom):null;
 const r=id?MOUSE.rows.find(x=>mget(x,'id')===id):null;curM=id;copyM=copyFrom||null;cur=null;
 const C=c=>MOUSE.cols.indexOf(c);
 const vals=r?r.slice():src?src.map((v,i)=>{const c=MOUSE.cols[i];return c==='id'?nextMouseId():['genotyping_date','mark','note'].includes(c)?'':v})
  :MOUSE.cols.map(c=>c==='id'?nextMouseId():c==='status'?'Live':'');
 const editable=edit&&canEdit(),tc=toe(vals[C('id')]),isNew=!r;
 $('dmsg').textContent='';$('dmsg').className='msg';
 $('dpos').textContent=`KPC mouse · ${vals[C('cage')]||'cage 미지정'}`;$('dttl').textContent=r?vals[C('id')]:src?`새 마우스 (${copyFrom} 복사)`:'새 마우스';
 const lbl=c=>MGENE[c]?`<i title="${MGENE[c][1].replace(/<\/?sup>/g,'')}">${MGENE[c][0]}</i>`:esc(MCOL[c]||c);
 const g=genFrom(vals[C('mother')],vals[C('father')]);
 let dl=MOUSE.cols.map((c,i)=>{const v=vals[i];
  if(editable){
   // fixed choices -> toggle buttons (click again to clear); dates -> calendar; status/parents -> dropdown
   if(MCHOICE[c])return`<dt>${lbl(c)}</dt><dd><input type="hidden" data-mi="${i}" value="${esc(v)}"><span class="pick" data-for="${i}">${MCHOICE[c].map(o=>`<button type="button" data-v="${esc(o)}" class="${o===v?'on':''}${c==='sex'?' s'+o.toLowerCase():''}${c==='kras'&&o==='+/-'?' kp':''}">${c==='sex'?(o==='M'?'♂ M':'♀ F'):esc(o)}</button>`).join('')}</span></dd>`;
   if(MDATE.includes(c))return`<dt>${lbl(c)}</dt><dd><input type="date" data-mi="${i}" value="${esc(v)}"></dd>`;
   if(c==='status')return`<dt>${lbl(c)}</dt><dd><select data-mi="${i}">${MSTATUS.map(s=>`<option${s===v?' selected':''}>${s}</option>`).join('')}${v&&!MSTATUS.includes(v)?`<option selected>${esc(v)}</option>`:''}</select></dd>`;
   if(c==='mother'||c==='father')return`<dt>${lbl(c)}</dt><dd><select data-mi="${i}" data-par="1">${parentOpts(c==='mother'?'F':'M',v,r?vals[C('id')]:'')}</select></dd>`;
   if(c==='generation')return`<dt>${lbl(c)}</dt><dd><input data-mi="${i}" id="m_gen" value="${esc(g===null?v:g)}"${g===null?'':' readonly'}><div class="hint" id="m_genh">${g===null?'부모가 없는 개체(처음 들여온 개체)만 직접 입력':'부모 세대로 자동 계산: MAX(모, 부) + 1'}</div></dd>`;
   if(c==='id'&&isNew)return`<dt>${lbl(c)}</dt><dd><input data-mi="${i}" value="${esc(v)}"><div class="cnt2">마리 수 <input type="number" id="m_count" min="1" max="20" value="1"> <span class="hint" id="m_counth"></span></div></dd>`;
   return`<dt>${lbl(c)}</dt><dd><input data-mi="${i}" value="${esc(v)}"${isNew&&c==='cage'&&!src?' autofocus':''}></dd>`}
  if(c==='sex'&&/^[mf]$/i.test(v))return`<dt>${lbl(c)}</dt><dd><span class="sxb ${v.toLowerCase()}">${v.toUpperCase()==='M'?'♂ M':'♀ F'}</span></dd>`;
  if(c==='kras'&&v==='+/-')return`<dt>${lbl(c)}</dt><dd><span class="kh">${esc(v)}</span></dd>`;
  if(c==='generation'&&r){const gd=genDisp(r);return`<dt>${lbl(c)}</dt><dd class="${gd?'':'na'}">${gd||'—'}</dd>`}
  return`<dt>${lbl(c)}</dt><dd class="${v?'':'na'}">${v?esc(v):'—'}</dd>`}).join('');
 const dob=vals[C('dob')];
 dl+=`<dt>주령</dt><dd class="${ageW(dob)===''?'na':''}">${ageW(dob)===''?'—':ageW(dob)+'주'}</dd>`;
 if(tc&&!isNew)dl+=`<dt>발가락</dt><dd>${tc.txt}${tc.bad?' <span style="color:var(--bad)">(9가 들어간 번호)</span>':''} <button class="btn sm" id="m_toe2">그림</button></dd>`;
 if(r){const kids=MOUSE.rows.filter(x=>mget(x,'mother')===id||mget(x,'father')===id).map(x=>mget(x,'id'));if(kids.length)dl+=`<dt>자손</dt><dd>${kids.length}마리 (${kids.slice(0,8).join(', ')}${kids.length>8?' …':''})</dd>`}
 $('ddl').innerHTML=dl;
 const delB='<button class="btn del" id="m_del" style="margin-left:auto">삭제</button>';
 $('dacts').innerHTML=editable?`<button class="btn pri" id="m_save">저장</button><button class="btn" id="m_cancel">취소</button>${r?delB:''}`
  :canEdit()?`<button class="btn pri" id="m_edit">수정</button><button class="btn" id="m_copy">복사</button>${delB}`:`<span style="font-size:12px;color:var(--mute)">수정하려면 ⚙ 편집 설정에서 토큰을 입력하세요.</span>`;
 det.classList.add('open');if(editable){updCount();const f=det.querySelector('input[autofocus]');if(f)f.focus()}}
function updCount(){const c=$('m_count'),h=$('m_counth');if(!c||!h)return;const n=+c.value||1,first=det.querySelector(`input[data-mi="${MOUSE.cols.indexOf('id')}"]`).value.trim();
 const ids=nextIds(first,n);h.textContent=n<2?'':ids?`${ids[0]} ~ ${ids[ids.length-1]} (9 포함·기존 번호 건너뜀)`:'여러 마리는 KPC-숫자 형식 번호에서만 가능';}
$('dacts').addEventListener('click',async e=>{const id=e.target.id;if(!id.startsWith('m_'))return;e.stopImmediatePropagation();
 if(id==='m_edit')return openMouse(curM,true);if(id==='m_copy')return openMouse(null,true,curM);
 if(id==='m_cancel')return curM?openMouse(curM,false):copyM?openMouse(copyM,false):closeDet();
 if(id==='m_del'){if(!confirm(`${curM}을(를) 목록에서 삭제할까요?\n(죽거나 희생한 개체는 삭제 대신 Status를 바꾸는 걸 권장합니다)`))return;
  const ok=await saveFile(MOUSE,rows=>rows.filter((r,i)=>i===0||r[1]!==curM),`마우스 ${curM} 삭제`);if(ok)closeDet();return}
 if(id==='m_save'){const C=c=>MOUSE.cols.indexOf(c),nv=MOUSE.cols.map(()=>'');
  det.querySelectorAll('[data-mi]').forEach(inp=>nv[+inp.dataset.mi]=inp.value.trim());
  const g=genFrom(nv[C('mother')],nv[C('father')]);if(g!==null)nv[C('generation')]=String(g);
  const nid=nv[C('id')];if(!nid)return toast('번호를 입력하세요.',false);
  const bad=MDATE.find(c=>{const v=nv[C(c)];return v&&!/^\d{4}-\d{2}-\d{2}$/.test(v)});if(bad)return toast(`${MCOL[bad]}는 YYYY-MM-DD 형식으로 입력하세요.`,false);
  const old=curM;
  if(old){if(nid!==old&&MOUSE.rows.some(r=>mget(r,'id')===nid))return toast(`${nid}은(는) 이미 있는 번호입니다.`,false);
   const ok=await saveFile(MOUSE,(rows,hdr)=>{const i=rows.findIndex((r,k)=>k>0&&r[1]===old);if(i<0)throw new Error(old+'을(를) 찾을 수 없습니다');
    rows[i]=hdr.map(c=>nv[C(c)]??'');return rows},`마우스 ${nid} 수정`);if(ok)openMouse(nid,false);return}
  // new (or copied): n consecutive free numbers starting at the typed one
  const n=Math.min(20,Math.max(1,+($('m_count')||{}).value||1)),ids=nextIds(nid,n);
  if(!ids)return toast('여러 마리는 KPC-숫자 형식 번호에서만 만들 수 있어요.',false);
  if(n===1&&MOUSE.rows.some(r=>mget(r,'id')===nid))return toast(`${nid}은(는) 이미 있는 번호입니다.`,false);
  const ok=await saveFile(MOUSE,(rows,hdr)=>{const have=new Set(rows.slice(1).map(r=>r[1]));
   for(const x of ids){if(have.has(x))throw new Error(x+'은(는) 이미 있습니다');rows.push(hdr.map(c=>c==='id'?x:(nv[C(c)]??'')))}return rows},
   n>1?`마우스 ${ids[0]}~${ids[n-1]} 추가 (${n}마리${copyM?', '+copyM+' 복사':''})`:`마우스 ${ids[0]} 추가${copyM?' ('+copyM+' 복사)':''}`);
  if(ok)openMouse(ids[0],false)}
 },true);
$('ddl').addEventListener('click',e=>{if(e.target.id==='m_toe2')return $('toed').showModal();
 const b=e.target.closest('.pick button');if(!b)return;const p=b.parentElement,inp=p.previousElementSibling,on=!b.classList.contains('on');
 p.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(on)b.classList.add('on');inp.value=on?b.dataset.v:''});
$('ddl').addEventListener('change',e=>{if(e.target.dataset.par){const C=c=>MOUSE.cols.indexOf(c);
  const m=det.querySelector(`[data-mi="${C('mother')}"]`).value,f=det.querySelector(`[data-mi="${C('father')}"]`).value,g=genFrom(m,f),gi=$('m_gen');
  if(gi){if(g===null){gi.readOnly=false;$('m_genh').textContent='부모가 없는 개체(처음 들여온 개체)만 직접 입력'}else{gi.value=g;gi.readOnly=true;$('m_genh').textContent='부모 세대로 자동 계산: MAX(모, 부) + 1'}}}});
$('ddl').addEventListener('input',e=>{if(e.target.id==='m_count'||+e.target.dataset.mi===MOUSE.cols.indexOf('id'))updCount()});

// ---------- settings dialog ----------
const setd=$('setd');
$('setb').onclick=()=>{$('s_name').value=cfg.name;$('s_tok').value=cfg.tok;$('s_repo').value=LS.get('repo');$('s_repo').placeholder=guessRepo()||'owner/repo';setd.showModal()};
$('s_cancel').onclick=()=>setd.close();
$('s_ok').onclick=()=>{LS.set('name',$('s_name').value.trim());LS.set('tok',$('s_tok').value.trim());LS.set('repo',$('s_repo').value.trim());setd.close();init()};
$('s_clr').onclick=()=>{['name','tok','repo'].forEach(k=>LS.set(k,''));setd.close();init()};
$('histb').onclick=()=>{ana.all.hist=true;view.t==='mouse'?renderMouse():renderAna();const c=$('histcard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})};
$('q').oninput=e=>{term=e.target.value.trim().toLowerCase();hl=null;render()};

async function init(){$('mode').textContent=canEdit()?'편집 가능':'보기 전용';$('mode').className='mode'+(canEdit()?' on':'');
 try{await Promise.all([loadHist(),...SHEETS.map(async sh=>{sh.apiErr=null;build(sh,await loadSheet(sh))}),
   (async()=>{try{MOUSE.build(MOUSE,await loadSheet(MOUSE))}catch(e){MOUSE.cols=[];MOUSE.rows=[]}})()]);
  const err=SHEETS.find(s=>s.apiErr);
  $('sub').textContent=err?`GitHub 연결 실패(${err.apiErr}) · 배포본 표시 중`:`${canEdit()?'최신 데이터':'배포된 데이터'} · ${new Date().toLocaleString('ko-KR')} 불러옴`;
  render()}catch(e){main.innerHTML=`<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`}}
init();
</script></body></html>
