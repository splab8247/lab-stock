<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>실험실 재고 현황</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e3e6eb;--acc:#2563eb;--empty:#f1f3f6;--hit:#f59e0b;--ok:#16a34a;--bad:#dc2626;
--occ-lo:#22c55e;--occ-mid:#f59e0b;--occ-hi:#ef4444;
--c-cell:#dbeafe;--c-bact:#dcfce7;--c-reag:#fef3c7;--c-si:#fce7f3;--k-cell:#2563eb;--k-bact:#16a34a;--k-reag:#d97706;--k-si:#db2777}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111418;--panel:#1a1e24;--ink:#e6e9ee;--mute:#9aa3af;--line:#2c323b;--empty:#20252c;
--c-cell:#1e3a5f;--c-bact:#1f4a32;--c-reag:#5a4614;--c-si:#5a2340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
header{padding:28px 28px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 4px}header .sub{color:var(--mute);font-size:14px}
.hright{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{padding:14px 18px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:340px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:var(--bad);border-color:var(--bad)}.btn.del:hover{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.mode{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--mute)}.mode.on{background:#dcfce7;color:#166534}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 100px)}
nav{border-right:1px solid var(--line);padding:12px;background:var(--panel);overflow:auto}
nav details{margin-bottom:6px}
nav summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-weight:600}
nav summary::-webkit-details-marker{display:none}
nav summary::before{content:"▸";font-size:11px;color:var(--mute);transition:transform .15s}
nav details[open]>summary::before{transform:rotate(90deg)}
nav summary:hover,nav button:hover{background:var(--bg)}
nav .cnt{margin-left:auto;font-size:11px;font-weight:400;color:var(--mute)}
nav button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 10px 6px 28px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
nav .on,nav .on .cnt{background:var(--acc);color:#fff}
nav .all{padding-left:10px;font-weight:600;margin-bottom:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
main{padding:20px;overflow:auto;min-width:0}
.crumb{color:var(--mute);font-size:13px;margin-bottom:10px}
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:96px}
.stat b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.stat.occ{position:relative;overflow:hidden;min-width:120px}
.stat.occ>b,.stat.occ>span{position:relative;z-index:1}
.stat.occ .lv{position:absolute;left:0;right:0;bottom:0;height:0;opacity:.35;transition:height 1.1s cubic-bezier(.2,.8,.2,1),background .4s}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px}
.box h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box h2 small{color:var(--mute);font-weight:400;font-size:12px}
.mini{margin-left:auto;display:flex;gap:6px}.mini span{font-size:11px;font-weight:400;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.grid{display:grid;gap:3px}
.hd{font-size:11px;color:var(--mute);text-align:center;align-self:center}
.slot{min-height:60px;border-radius:5px;padding:5px 6px;font-size:11px;line-height:1.25;background:var(--empty);overflow:hidden;word-break:break-word;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.slot:hover{outline:2px solid var(--acc)}
.slot.e:hover::after{content:"+ 새로 입력";color:var(--mute);margin:auto;font-size:10px}
.slot .p{font-weight:600}.slot .s{color:var(--mute);font-size:10px;margin-top:auto}
.slot.m{background:repeating-linear-gradient(45deg,var(--empty),var(--empty) 4px,transparent 4px,transparent 8px);color:var(--mute);font-size:10px;justify-content:center;align-items:center;cursor:default}
.slot.m:hover{outline:none}
.slot.hit{outline:2px solid var(--hit)}.slot.dim{opacity:.25}
.slot .c{font-size:10px}.slot .s{display:flex;flex-direction:column;line-height:1.2}.slot .mg2{font-weight:600;color:var(--ink);opacity:.75}
.slot.mg{justify-content:center;align-items:center;text-align:center;font-size:12px}.slot.mg .s{margin-top:0}
.grid.ed{user-select:none}
.ana{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.ch select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px;max-width:220px}
.mute{color:var(--mute);font-size:12px}.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.bars{max-height:300px;overflow:auto;padding-right:4px}
.bar{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer;font-size:12px}
.bar:hover,.bar.on{background:var(--bg)}.bar.cur .bl{font-weight:700}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt{height:12px;background:var(--empty);border-radius:3px;overflow:hidden}.bt i{display:block;height:100%;border-radius:3px}
.bn{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px 12px}
.hist{max-height:300px;overflow:auto}.hist.open{max-height:none}
.hi{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;border-radius:4px}
.hi:hover{background:var(--bg)}.hw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hm{color:var(--mute);font-size:11px;white-space:nowrap}
.hv{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--mute);white-space:nowrap}
.hv.v-추가{background:#dcfce7;color:#166534}.hv.v-수정{background:#dbeafe;color:#1e40af}.hv.v-삭제{background:#fee2e2;color:#991b1b}.hv.v-병합,.hv.v-병합해제{background:#ede9fe;color:#5b21b6}.hv.v-이름변경{background:#fef3c7;color:#92400e}
.slot.flash{animation:flash 1.6s ease}@keyframes flash{0%,60%{outline:3px solid var(--hit);outline-offset:-3px}100%{outline-color:transparent}}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer}.chip:hover{border-color:var(--acc);color:var(--acc)}
.more{margin-top:6px;border:0;background:none;color:var(--acc);cursor:pointer;font-size:12px}
@media(max-width:1000px){.ana{grid-template-columns:1fr}}
.slot.sel{outline:2px dashed var(--acc);outline-offset:-2px;filter:brightness(.92)}
#mbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0003;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;transition:transform .2s;z-index:6;font-size:14px}
#mbar.show{transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-150%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;transition:transform .2s;z-index:7;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--bad);color:#fff}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
tr[data-id]{cursor:pointer}tr[data-id]:hover td{background:var(--bg)}tr.dim{opacity:.3}
#det{position:fixed;top:0;right:0;height:100%;width:400px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px #0002;padding:20px;transform:translateX(100%);transition:transform .2s;overflow:auto;z-index:5}
#det.open{transform:none}
#det h3{margin:4px 0 2px;font-size:18px}#det .pos{font-size:12px;color:var(--mute)}
#det dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:16px 0 0;font-size:13px;align-items:center}
#det dt{color:var(--mute)}#det dd{margin:0;word-break:break-word}#det dd#det input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#det .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#det .x{float:right;cursor:pointer;border:0;background:none;color:var(--mute);font-size:20px}
.msg{margin-top:12px;font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--panel);color:var(--ink);width:420px;max-width:92vw}
dialog label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
dialog input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog p{font-size:12px;color:var(--mute);margin:6px 0 0}
dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
nav .addbox{color:var(--acc);font-size:12px;margin-top:2px}
.btn.sm{padding:3px 10px;font-size:11px;font-weight:400}
.box h2 .btn.sm{margin-left:4px}
.empty{color:var(--mute);padding:40px;text-align:center}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);max-height:240px}#q{min-width:0;width:100%}.hright{width:100%}main{padding:16px}.box{overflow-x:auto}.grid{min-width:640px}header{padding:20px 16px}}
</style></head><body>
<header><div><h1>실험실 재고 현황</h1><div class="sub" id="sub">불러오는 중…</div></div>
<div class="hright"><input id="q" placeholder="검색 (예: PD36, siOGT, pSP12)"><a class="btn" href="stock.xlsx" download>⬇ 엑셀</a><button class="btn" id="histb">최근 기록</button><span class="mode" id="mode">보기 전용</span><button class="btn" id="setb">⚙ 편집 설정</button></div></header>
<div class="wrap"><nav id="nav"></nav><main id="main"><div class="empty">데이터를 불러오는 중…</div></main></div>
<aside id="det"><button class="x" id="dx" aria-label="닫기">✕</button><div class="pos" id="dpos"></div><h3 id="dttl"></h3><dl id="ddl"></dl><div class="acts" id="dacts"></div><div class="msg" id="dmsg"></div></aside>
<div id="mbar"></div><div id="toast"></div>
<dialog id="boxd"><h3 style="margin:0">박스 추가</h3>
 <label>시트</label><select id="b_sheet"></select>
 <label>박스 이름</label><input id="b_name" placeholder="예: cell_stock9">
 <div style="display:flex;gap:10px"><div style="flex:1"><label>열 수 (A~)</label><input id="b_cols" type="number" min="1" max="26" value="9"></div><div style="flex:1"><label>행 수 (1~)</label><input id="b_rows" type="number" min="1" max="50" value="9"></div></div>
 <p>빈 칸으로 만들어집니다. 만든 뒤 칸을 눌러 입력하세요.</p><p id="b_msg" style="color:var(--bad)"></p>
 <div class="row"><button class="btn" id="b_cancel">취소</button><button class="btn pri" id="b_ok">추가</button></div></dialog>
<dialog id="setd"><h3 style="margin:0">편집 설정</h3>
 <p>이 컴퓨터의 이 브라우저에만 저장됩니다. 공용 PC에서는 사용 후 [지우기]를 누르세요.</p>
 <label>내 이름 (수정 기록에 남음)</label><input id="s_name" placeholder="홍길동">
 <label>GitHub 토큰 (관리자에게 받은 값)</label><input id="s_tok" type="password" placeholder="github_pat_…">
 <label>저장소 (owner/repo)</label><input id="s_repo" placeholder="자동 인식">
 <div class="row"><button class="btn" id="s_clr">지우기</button><button class="btn" id="s_cancel">닫기</button><button class="btn pri" id="s_ok">저장</button></div></dialog>
<script>
const SHEETS=[
 {key:'celline', file:'celline.csv', label:'Cell line', c:'--c-cell', k:'--k-cell', p:'cell line', s:'date'},
 {key:'bacteria',file:'bacteria.csv',label:'Bacteria',  c:'--c-bact', k:'--k-bact', p:'name', s:'date'},
 {key:'reagent', file:'reagent.csv', label:'Reagent',   c:'--c-reag', k:'--k-reag', p:'name', s:'concentration'},
 {key:'siRNA',   file:'siRNA.csv',   label:'siRNA',     c:'--c-si',   k:'--k-si',   p:'siRNA name', s:'concentration'}];
const BRANCH='main';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

// ---------- settings (per browser) ----------
const LS={get(k){try{return localStorage.getItem('stock.'+k)||''}catch(e){return''}},set(k,v){try{v?localStorage.setItem('stock.'+k,v):localStorage.removeItem('stock.'+k)}catch(e){}}};
function guessRepo(){const h=location.hostname.match(/^([^.]+)\.github\.io$/);const seg=location.pathname.split('/').filter(Boolean)[0];return h&&seg?`${h[1]}/${seg}`:''}
const cfg={get name(){return LS.get('name')},get tok(){return LS.get('tok')},get repo(){return LS.get('repo')||guessRepo()}};
const canEdit=()=>!!(cfg.tok&&cfg.repo);

// ---------- CSV ----------
function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.length>1||r[0]!=='')}
const toCSV=rows=>rows.map((r,i)=>r.map(v=>i===0&&!/[",\n]/.test(v)?v:'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')+'\n';

// ---------- GitHub API ----------
const b64e=s=>{const b=new TextEncoder().encode(s);let o='';b.forEach(x=>o+=String.fromCharCode(x));return btoa(o)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`+(opt.method?'':`?ref=${BRANCH}&t=${Date.now()}`),
 {...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.tok,...(opt.headers||{})}});
 if(!r.ok){const e=new Error((await r.json().catch(()=>({}))).message||r.statusText);e.status=r.status;throw e}return r.json()}
async function loadSheet(sh){
 if(canEdit()){try{const j=await gh('data/'+sh.file);sh.sha=j.sha;return b64d(j.content)}catch(e){console.warn('API load failed, fallback',e);sh.apiErr=e.message}}
 const r=await fetch('data/'+sh.file+'?t='+Date.now());if(!r.ok)throw new Error(sh.file+' 불러오기 실패');return r.text()}

// ---------- model ----------
const pp=p=>{const m=/^([A-Z]+)-(\d+)$/.exec(p);return m?{c:m[1],r:+m[2]}:null};
function build(sh,text){const rows=parseCSV(text);sh.cols=rows[0];sh.rows=rows.slice(1);
 const ix=n=>sh.cols.indexOf(n),iP=ix(sh.p),iS=ix(sh.s),iMg=ix('manager'),iD=ix('date');sh.iM=ix('merged_to');const map=new Map();
 sh.vis=sh.cols.map((c,i)=>i).filter(i=>i>=2&&i!==sh.iM);  // columns shown in the detail panel
 sh.rows.forEach((r,ri)=>{while(r.length<sh.cols.length)r.push('');const o={sh,ri,vals:r,box:r[0],pos:r[1],prim:'',sec:r[iS]||''};
  // name shown in the slot: the sheet's main column, else the first non-empty field
  o.prim=r[iP]||(sh.vis.map(i=>r[i]).find(v=>v)||'');
  o.mgr=iMg>=0?r[iMg]:'';o.date=iD>=0?r[iD]:'';
  o.mergeTo=sh.iM>=0?r[sh.iM]:'';o.merged=!!o.mergeTo;o.filled=!o.merged&&sh.vis.some(i=>r[i]);o.text=r.join(' ').toLowerCase();
  if(!map.has(o.box))map.set(o.box,{sh,name:o.box,slots:[]});map.get(o.box).slots.push(o)});
 sh.boxes=[...map.values()];
 sh.boxes.forEach(b=>{b.isList=b.slots.every(s=>s.pos.startsWith('list-'));if(b.isList)return;
  b.colsL=[...new Set(b.slots.map(s=>pp(s.pos).c))];b.nrow=Math.max(...b.slots.map(s=>pp(s.pos).r));
  b.at=new Map(b.slots.map(s=>[s.pos,s]));
  // span rect per slot (covered cells extend their anchor's rect); indices: c = column index, r = row number
  b.slots.forEach(s=>{const p=pp(s.pos);s.rect={c0:b.colsL.indexOf(p.c),c1:b.colsL.indexOf(p.c),r0:p.r,r1:p.r}});
  b.slots.filter(s=>s.merged).forEach(s=>{const a=b.at.get(s.mergeTo);if(!a){s.merged=false;return}const p=pp(s.pos),ci=b.colsL.indexOf(p.c);
   a.rect.c0=Math.min(a.rect.c0,ci);a.rect.c1=Math.max(a.rect.c1,ci);a.rect.r0=Math.min(a.rect.r0,p.r);a.rect.r1=Math.max(a.rect.r1,p.r);a.isAnchor=true})})}
const ALL=()=>SHEETS.flatMap(s=>s.boxes||[]);
let view={t:'all'},term='',hl=null;  // hl: exact highlight set by the analytics chips {kind:'item'|'mgr',key,box}
const NOMGR='(미기재)';
const hlTest=s=>hl.kind==='item'?s.prim.trim()===hl.key:(s.mgr.trim()||NOMGR)===hl.key;
const filt=()=>!!(term||hl);
const match=s=>s.filled&&(hl?hlTest(s):!!term&&s.text.includes(term));
function scope(){return view.t==='all'?ALL():view.t==='group'?SHEETS.find(g=>g.key===view.g).boxes:ALL().filter(b=>b.sh.key===view.g&&b.name===view.b)}
function counts(boxes){let f=0,e=0,h=0;boxes.forEach(b=>b.slots.forEach(s=>{if(s.merged)return;s.filled?f++:e++;if(match(s))h++}));return{f,e,h,n:boxes.length}}
const cnt=boxes=>{const c=counts(boxes);return filt()?`${c.h} / ${c.f}`:`${c.f}`};
const rectTxt=(b,r)=>`${b.colsL[r.c0]}-${r.r0} ~ ${b.colsL[r.c1]}-${r.r1}`;

// ---------- render ----------
const nav=$('nav'),main=$('main');
function renderNav(){const open=new Set([...nav.querySelectorAll('details[open]')].map(d=>d.dataset.g));
 let h=`<button class="all${view.t==='all'?' on':''}" data-v='{"t":"all"}'>전체 보기<span class="cnt">${cnt(ALL())}</span></button>`;
 SHEETS.forEach(g=>{h+=`<details data-g="${g.key}"${open.has(g.key)||view.g===g.key?' open':''}><summary><i class="dot" style="background:var(${g.k})"></i>${g.label}<span class="cnt">${cnt(g.boxes)}</span></summary>`;
  g.boxes.forEach(b=>{const on=view.t==='box'&&view.g===g.key&&view.b===b.name;
   h+=`<button class="${on?'on':''}" data-v='${esc(JSON.stringify({t:'box',g:g.key,b:b.name}))}'>${esc(b.name)}<span class="cnt">${cnt([b])}</span></button>`});

// replace rows (by box|matrix) in the latest copy of the CSV
function saveRows(sh,changes,what,focusKey){

  for(const [k,nv] of changes){const idx=rows.findIndex((r,i)=>i>0&&r[0]+'|'+r[1]===k);if(idx<0)throw new Error(k+' 칸을 찾을 수 없습니다');

   rows[idx]=hdr.map(c=>{const i=sh.cols.indexOf(c);return i>=0?nv[i]:(rows[idx][hdr.indexOf(c)]||'')})}
  return rows},what,focusKey)}
// re-read the latest CSV, apply mutate(rows,hdr) -> rows, commit; retries on concurrent saves
async function saveFile(sh,mutate,what,focusKey){
 if(!cfg.name){toast('⚙ 편집 설정에서 이름을 먼저 입력하세요.',false);$('dmsg').className='msg bad';$('dmsg').textContent='⚙ 편집 설정에서 이름을 먼저 입력하세요.';return false}

 try{for(let attempt=0;attempt<3;attempt++){
   // always re-read latest file so concurrent edits on other cells are kept
   const j=await gh('data/'+sh.file);let rows=parseCSV(b64d(j.content));const hdr=rows[0];
   rows=mutate(rows,hdr);
   try{await gh('data/'+sh.file,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({branch:BRANCH,sha:j.sha,
     message:`${what} (${cfg.name})`,content:b64e(toCSV(rows))})});
    hist.unshift({sha:'',date:new Date().toISOString(),what,who:cfg.name});  // show own edit right away
    build(sh,toCSV(rows));render();toast('저장했습니다. 엑셀 파일은 1~2분 뒤 자동 갱신됩니다.');
    const ns=focusKey&&sh.boxes.flatMap(b=>b.slots).find(x=>keyOf(x.box,x.pos)===focusKey);

    return true}catch(e){if(e.status!==409)throw e}}  // 409 = someone else saved first -> retry on fresh copy
  throw new Error('다른 사람이 동시에 저장 중입니다. 잠시 후 다시 시도하세요.')}

  if(on){const per=new Map();arr.forEach(s=>per.set(s.box,(per.get(s.box)||0)+1));
   h+=`<div class="chips">${[...per.entries()].map(([bx,n])=>{const on=hl&&hl.kind===kind&&hl.key===k&&hl.box===bx;return`<button class="chip${on?' on':''}" data-go="${sh.key}|${esc(bx)}" data-kind="${kind}" data-key="${esc(k)}" title="${on?'다시 누르면 강조 해제':'이 박스에서 강조해서 보기'}">${esc(bx)} <b>${n}</b> ${on?'✕':'→'}</button>`}).join('')}</div>`}});
 if(items.length>15)h+=`<button class="more" data-more="${kind}">${ana.all[kind]?'접기':`나머지 ${items.length-15}개 더 보기`}</button>`;
 if(!items.length)h+='<div class="mute" style="padding:20px">데이터 없음</div>';
 return h+'</div></div>'}
function renderAna(){const el=$('ana');if(!el)return;const sh=anaSheet(),slots=anaSlots(sh);
 const sel=view.t==='all'?`<select id="a_sheet">${SHEETS.map(s=>`<option value="${s.key}"${s.key===sh.key?' selected':''}>${s.label}</option>`).join('')}</select>`:`<span class="tag">${sh.label}</span>`;
 el.innerHTML=barCard('item',`${esc(sh.p)} 별 개수`,sel,sh,slots,s=>s.prim.trim())
  +histCard()}

// ---------- recent edits (history.json built by Actions; live from the API when a token is set) ----------
let hist=[],histLive=false;
async function loadHist(){histLive=false;
 if(canEdit()){try{const r=await fetch(`https://api.github.com/repos/${cfg.repo}/commits?path=data&sha=${BRANCH}&per_page=100`,{headers:{'Authorization':'Bearer '+cfg.tok}});
  if(r.ok){hist=(await r.json()).map(c=>{const m=/^(.+?)\s*\(([^()]+)\)\s*$/.exec(c.commit.message.split('\n')[0]);return m&&{sha:c.sha,date:c.commit.committer.date,what:m[1],who:m[2]}}).filter(Boolean).slice(0,50);histLive=true;return}}catch(e){}}
 try{const r=await fetch('history.json?t='+Date.now());hist=r.ok?await r.json():[]}catch(e){hist=[]}}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return'방금';if(s<3600)return`${Math.floor(s/60)}분 전`;if(s<86400)return`${Math.floor(s/3600)}시간 전`;if(s<86400*7)return`${Math.floor(s/86400)}일 전`;return new Date(d).toLocaleDateString('ko-KR')}
const histBox=h=>h.what.replace(/^박스 (추가|삭제|이름 변경) /,'').split(/\s/)[0];
function histCard(){
 const list=view.t==='box'?hist.filter(h=>histBox(h)===view.b||h.what.includes('→ '+view.b)):hist;
 const top=ana.all.hist?list:list.slice(0,12);
 // no link to github.com: its commit pages rate-limit anonymous visitors (429) on the shared lab IP
 let h=`<div class="card" id="histcard"><div class="ch"><b>최근 변경 기록</b><span class="mute">최근 ${list.length}건 · ${histLive?'실시간':'1~2분 지연'}</span>${list.length>12?`<button class="more" style="margin:0 0 0 auto" data-more="hist">${ana.all.hist?'접기':'더보기'}</button>`:''}</div><div class="hist${ana.all.hist?' open':''}">`;
 top.forEach((x,i)=>{const verb=(x.what.match(/(병합 해제|병합|삭제|추가|수정|이름 변경)/)||[''])[0];
  h+=`<div class="hi" data-hist="${i}" title="${esc(new Date(x.date).toLocaleString('ko-KR'))}"><span class="hv v-${verb.replace(' ','')}">${esc(verb||'변경')}</span><span class="hw">${esc(x.what.replace(verb,'').trim())}</span><span class="hm">${esc(x.who)} · ${ago(x.date)}</span></div>`});
 if(!list.length)h+=`<div class="mute" style="padding:20px">${view.t==='box'?'이 박스의 변경 기록이 없습니다':'아직 사이트에서 저장한 기록이 없습니다'}</div>`;
 return h+'</div></div>'}
main.addEventListener('click',e=>{const it=e.target.closest('[data-hist]');if(!it)return;
 const list=view.t==='box'?hist.filter(h=>histBox(h)===view.b||h.what.includes('→ '+view.b)):hist,x=list[+it.dataset.hist];
 const nb=(x.what.match(/→ (\S+)$/)||[])[1]||histBox(x);const b=ALL().find(b=>b.name===nb);
 if(!b)return toast(`'${nb}' 박스는 지금 없습니다 (삭제되었거나 이름이 바뀜).`,false);
 hl=null;term='';$('q').value='';view={t:'box',g:b.sh.key,b:b.name};render();main.scrollTop=0;
 const pos=(x.what.match(/\b([A-Z]-\d+)\b/)||[])[1],s=pos&&b.at&&b.at.get(pos);
 if(s){const a=s.merged?b.at.get(s.mergeTo):s;openDet(a,false);const el=main.querySelector(`[data-pos="${a.pos}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}}});
main.addEventListener('click',e=>{const t=e.target;
 const bar=t.closest('.bar[data-kind]');if(bar){const k=bar.dataset.kind,key=bar.dataset.key;ana.open[k]=ana.open[k]===key?null:key;renderAna();return}
 const go=t.closest('.chip[data-go]');if(go){const [k,bx]=go.dataset.go.split('|'),kind=go.dataset.kind,key=go.dataset.key;
  if(hl&&hl.kind===kind&&hl.key===key&&hl.box===bx){view=hl.prev;hl=null}  // same chip again -> undo highlight, back to previous view
  else{hl={kind,key,box:bx,prev:hl?hl.prev:view};view={t:'box',g:k,b:bx};term='';$('q').value=''}
  render();main.scrollTop=0;return}
 if(t.closest('#hlx')){view=hl.prev;hl=null;render();return}
 const more=t.closest('[data-more]');if(more){ana.all[more.dataset.more]=!ana.all[more.dataset.more];renderAna()}});
main.addEventListener('change',e=>{if(e.target.id==='a_sheet'){ana.sheet=e.target.value;ana.open={item:null,mgr:null};renderAna()}});

// ---------- settings dialog ----------
const setd=$('setd');
$('setb').onclick=()=>{$('s_name').value=cfg.name;$('s_tok').value=cfg.tok;$('s_repo').value=LS.get('repo');$('s_repo').placeholder=guessRepo()||'owner/repo';setd.showModal()};
$('s_cancel').onclick=()=>setd.close();
$('s_ok').onclick=()=>{LS.set('name',$('s_name').value.trim());LS.set('tok',$('s_tok').value.trim());LS.set('repo',$('s_repo').value.trim());setd.close();init()};
$('s_clr').onclick=()=>{['name','tok','repo'].forEach(k=>LS.set(k,''));setd.close();init()};
$('histb').onclick=()=>{ana.all.hist=true;renderAna();const c=$('histcard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})};
$('q').oninput=e=>{term=e.target.value.trim().toLowerCase();hl=null;render()};

async function init(){$('mode').textContent=canEdit()?'편집 가능':'보기 전용';$('mode').className='mode'+(canEdit()?' on':'');
 try{await Promise.all([loadHist(),...SHEETS.map(async sh=>{sh.apiErr=null;build(sh,await loadSheet(sh))})]);
  const err=SHEETS.find(s=>s.apiErr);
  $('sub').textContent=err?`GitHub 연결 실패(${err.apiErr}) · 배포본 표시 중`:`${canEdit()?'최신 데이터':'배포된 데이터'} · ${new Date().toLocaleString('ko-KR')} 불러옴`;
  render()}catch(e){main.innerHTML=`<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`}}
init();
</script></body></html>
