name: build xlsx & deploy site

on:
  push:
    branches: [main]
    paths: ["data/**", "site/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stock.xlsx from data/*.csv
        run: |
          pip install --quiet openpyxl
          python scripts/build_xlsx.py

      - name: Commit stock.xlsx
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add stock.xlsx
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "stock.xlsx 자동 갱신"
            git pull --rebase origin main
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp data/*.csv _site/data/
          cp stock.xlsx _site/
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
